# Complete example of the Jevlar configuration surface. Every section and
# field is shown; the file validates when TYPESAFE_API_KEY,
# UPSTAGE_API_KEY, JEVLAR_APP_PROD_HASH and JEVLAR_BATCH_HASH are set and
# the secondary key's secret mount exists (see configs/container.toml for a
# smaller, runnable container example). Field documentation lives in
# internal/config.
config_version = 1

[server]
listen                 = "${JEVLAR_LISTEN:-127.0.0.1:8080}"
admin_listen           = "127.0.0.1:8081"
admin_token            = "${JEVLAR_ADMIN_TOKEN:-}"      # empty = loopback-only
request_timeout_ms     = 30_000
shutdown_grace_ms      = 10_000
read_header_timeout_ms = 5_000
max_body_bytes         = 262_144
max_response_bytes     = 1_048_576
max_inflight           = 4_096
log_level              = "info"
log_bodies             = false

[security]
strict_file_permissions = false      # true = refuse group/world-readable config

[usage]
enabled        = false
dir            = "/var/lib/jevlar"
retention_days = 30
max_file_mb    = 256

[auth]
# inbound client keys: sha256 hex from `jevlar keyhash <token>`
keys = [
  { id = "app-prod", hash = "${JEVLAR_APP_PROD_HASH}", rpm = 600, tpm = 6_000_000 },
  { id = "batch",    hash = "${JEVLAR_BATCH_HASH}",    rpm = 120, tpm = 12_000_000 },
]

[accounts.typesafe-main]              # provider limits are per account
rpm = 1_200
tpm = 15_000_000

[accounts.upstage-main]
rpm = 100
tpm = 250_000

[[providers]]
name            = "typesafe"
base_url        = "https://api.typesafe.ai"
path            = "/v1/systemone"
auth            = "bearer"
account         = "typesafe-main"
models          = ["jev-latest", "jev-1.13.0", "jev-1.14"]
timeout_ms      = 8_000
max_concurrency = 64
api_keys = [
  { id = "primary",   value = "${TYPESAFE_API_KEY}" },
  { id = "secondary", value_file = "/run/secrets/typesafe_secondary" },
]

[[providers]]
name            = "ollama-local"
base_url        = "http://127.0.0.1:11434"
path            = "/v1/systemone"
auth            = "none"
models          = ["nimble", "tev1"]
timeout_ms      = 30_000
max_concurrency = 8

[[providers]]
name            = "upstage"
base_url        = "https://api.upstage.ai"
path            = "/v1/systemone"
auth            = "bearer"
account         = "upstage-main"
models          = ["solar-decide"]
timeout_ms      = 8_000
api_keys = [{ id = "upstage-1", value = "${UPSTAGE_API_KEY}" }]

# Alias → ordered (provider, model) targets. The requested model may differ per target.
[models."jev-latest"]
targets = [
  { provider = "typesafe",     model = "jev-latest" },
  { provider = "ollama-local", model = "nimble" },
]
policy        = "priority"        # priority | fastest
max_attempts  = 3
ewma_alpha    = 0.2               # fastest only
hysteresis_ms = 15                # fastest only
explore_every = 100               # fastest only

[breaker]
threshold   = 5
cooldown_ms = 30_000
